<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#576F1F">
    <title>Connexion indisponible — Manzi-mfa</title>
    <style>
      :root { color-scheme: light; --background: #f5f1e8; --text: #1f1f1f; --primary: #576f1f; --hover: #556b2f; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--background); color: var(--text); font: 1rem/1.625 'Hanken Grotesk', system-ui, sans-serif; }
      main { max-width: 40rem; margin: auto; padding: 3.25rem 0.75rem; overflow-wrap: anywhere; }
      img { display: block; width: 64px; height: 64px; }
      h1 { font: bold 2rem/1.25 Alegreya, Georgia, serif; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; min-width: 44px; margin-top: 1rem; padding: 0.75rem 2rem; border-radius: 999px; background: var(--primary); color: white; font-weight: 600; text-underline-offset: 4px; }
      a:hover { background: var(--hover); }
      :focus-visible { outline: 3px solid var(--primary); outline-offset: 4px; }
      @media (min-width: 640px) { main { padding: 3.25rem 1.25rem; } h1 { font-size: 2.75rem; } }
    </style>
  </head>
  <body>
    <main aria-labelledby="offline-title">
      <img src="/logo.png" alt="Collectif Mongulu" width="64" height="64">
      <h1 id="offline-title">Connexion indisponible</h1>
      <p>Impossible de joindre Manzi-mfa. Vérifiez votre connexion Internet, puis réessayez.</p>
      <p>Une connexion est nécessaire pour accéder à votre compte et à votre profil.</p>
      <a href="/">Réessayer</a>
    </main>
  </body>
</html>
