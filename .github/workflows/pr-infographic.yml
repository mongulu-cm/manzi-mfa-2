name: Infographie avant fusion

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Numéro de la PR à vérifier
        type: number
        required: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: infographic-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request }}
  cancel-in-progress: true

jobs:
  infographic:
    name: Vérification de l’infographie
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Ne jamais exécuter le code de la branche proposée avec ce jeton en écriture.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const { checkPullRequest } = require('./.github/scripts/pr-infographic.cjs')
            const state = await checkPullRequest({ github, context })
            if (state === 'failure' || state === 'error') {
              core.setFailed('Une infographie accessible doit être affichée dans une section « Infographie » de la description ou d’un commentaire.')
            }
